[application]
name = "crystal-forge-ui"
default_platform = "web"

[web.app]
title = "Crystal Forge"

[web.watcher]
reload_html = true
watch_path = ["src"]

[web.resource]
style = []

[web.resource.dev]
style = []

[web.proxy]
# Proxy API requests to the backend server during development
# This allows `dx serve` to forward /api/* requests to the Crystal Forge server
backend = "http://localhost:3000"

[application]
name = "crystal-forge-ui"
default_platform = "web"

[web.app]
title = "Crystal Forge"

[web.watcher]
reload_html = true
watch_path = ["src"]

[web.resource]
style = ["/assets/tailwind.min.css"]

[web.resource.dev]
# Use the same vendored CSS in dev so styling matches offline + release.
style = ["/assets/tailwind.min.css"]

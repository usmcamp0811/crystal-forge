[package]
name = "crystal-forge-ui"
version = "0.3.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
uuid = { version = "1", features = ["v4", "serde", "js"] }
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Clipboard", "Crypto", "Document", "DomRect", "DomTokenList", "Element", "FormData", "Headers", "HtmlAnchorElement", "HtmlElement", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "Location", "Navigator", "Node", "NodeList", "Notification", "Response", "Url", "Window", "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "BinaryType"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[package]
name = "crystal-forge-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "0.4", features = ["serde"] }
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
uuid = { version = "1", features = ["v4", "serde", "js"] }
web-sys = { version = "0.3", features = ["Crypto", "Document", "Element", "Headers", "Location", "Notification", "Response", "Window"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
ed25519-dalek = "2"
base64 = "0.22"

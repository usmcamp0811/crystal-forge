[package]
name = "cf-agent"
version = "0.3.0"
edition = "2024"
description = "Crystal Forge deployment agent"

[dependencies]
cf-config = { path = "../cf-config" }
cf-protocol = { path = "../cf-protocol" }
anyhow = "1.0.98"
base64 = "0.21"
ed25519-dalek = { version = "2", features = ["rand_core"] }
nix = { version = "0.30.1", default-features = false, features = ["inotify", "fs", "user"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
sysinfo = "0.34.2"
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
hostname = "0.3"

[[bin]]
name = "agent"
path = "src/bin/agent.rs"

[package]
name = "cf-builder"
version = "0.3.0"
edition = "2024"
description = "Crystal Forge remote build worker"

[dependencies]
cf-config = { path = "../cf-config" }
cf-protocol = { path = "../cf-protocol" }
anyhow = "1.0.98"
async-trait = "0.1"
rand = "0.8"
base64 = "0.21"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3.31"
hex = "0.4"
nix = { version = "0.30.1", default-features = false, features = ["fs"] }
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sysinfo = "0.34.2"
tempfile = "3.20.0"
tokio = { version = "1.37", features = ["full"] }
tokio-tungstenite = "0.24"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
winnow = "0.7.11"

[[bin]]
name = "builder"
path = "src/bin/builder.rs"

[package]
name = "cf-protocol"
version = "0.3.0"
edition = "2024"
description = "Crystal Forge wire protocol types shared between server, builder, and agent"

[dependencies]
anyhow = "1.0.98"
base64 = "0.21"
chrono = { version = "0.4.41", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sysinfo = "0.34.2"
tracing = "0.1.41"
uuid = { version = "1.17.0", features = ["v4", "serde"] }

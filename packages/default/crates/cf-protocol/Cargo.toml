[package]
name = "cf-protocol"
version = "0.3.0"
edition = "2024"
description = "Crystal Forge wire protocol types shared between server, builder, and agent"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.17.0", features = ["v4", "serde"] }

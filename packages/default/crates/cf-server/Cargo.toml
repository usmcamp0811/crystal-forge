[package]
name = "cf-server"
version = "0.3.0"
edition = "2024"

[features]
default = []
embedded-ui = ["dep:include_dir", "dep:mime_guess"]

[dependencies]
cf-config = { path = "../cf-config" }
cf-protocol = { path = "../cf-protocol" }
hostname = "0.3"
anyhow = "1.0.98"
dotenvy = "0.15.7"
envy = "0.4.2"
sysinfo = "0.34.2"
nix = { version = "0.30.1", default-features = false, features = ["inotify", "fs", "user", "signal", "process"] }
libc = "0.2"
postgres = "0.19.10"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
config = { version = "0.15", features = ["toml", "json"] }
tempfile = "3.20.0"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
axum = { version = "0.7", features = ["ws"] }
hyper = { version = "1", features = ["full"] }
serde_json = "1"
tokio-postgres = { version = "0.7.13", features = ["runtime", "with-uuid-1"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.21"
ring = "0.17.14"
hex = "0.4"
reqwest = { version = "0.11", features = ["json","blocking", "rustls-tls", "stream"] }
sha2 = "0.10.9"
openidconnect = "3.5"
jsonwebtoken = "9"
url = "2"
argon2 = "0.5"
systemstat = "0.2.4"
num_cpus = "1.16"
futures = "0.3.31"
tokio-tungstenite = "0.24"
bigdecimal = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["uuid", "postgres", "runtime-tokio", "chrono", "macros", "bigdecimal"] }
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10"
watch = "0.2.3"
clap = { version = "4.0", features = ["derive"] }
tokio-test = "0.4.4"
axum-test = "17.3.0"
winnow = "0.7.11"
bytes = "1.10.1"
humantime-serde = "1.1.1"
include_dir = { version = "0.7.4", optional = true }
mime_guess = { version = "2.0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
dashmap = "6"

[dev-dependencies]
serial_test = "3.2"

[lib]
name = "crystal_forge"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "test-agent"
path = "src/bin/test-agent.rs"

[[bin]]
name = "hardening-worker"
path = "src/bin/hardening-worker.rs"

[package.metadata.sqlx]
offline = true

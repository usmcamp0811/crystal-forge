stages:
  - check
  - metrics
  - coverage
  - deploy
  - bump

# This static browser gate does not need the Dioxus application or a database.
docs-site-check:
  stage: check
  tags:
    - nix
  script:
    - nix build .#docs-site.tests.browser -L --out-link docs-site-check-result --builders '' --max-jobs 1 --cores 2
    - nix build .#docs-site -L --out-link docs-site-result --builders '' --max-jobs 1 --cores 2
    - mkdir -p public docs-site-screenshots
    - cp -rL docs-site-result/share/docs-site/. public/
    - cp -rL docs-site-check-result/screenshots/. docs-site-screenshots/
  artifacts:
    expire_in: 30 days
    paths:
      - public/
      - docs-site-screenshots/
    expose_as: "Documentation Site"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

docs-pages:
  stage: deploy
  tags:
    - nix
  dependencies:
    - docs-site-check
  script:
    - test -s public/index.html
  pages:
    publish: public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

coverage-check:
  stage: coverage
  tags:
    - nix
  before_script:
    # Retain repository authentication for flake input resolution. Collection
    # itself never builds or runs product tests.
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  needs:
    - component-tests
    - state-machine-tests
    - cve-processing-test
    - dashboard-visibility-tests
  script:
    # This job reads artifacts only. All test failures belong to their producers.
    - >-
      nix run .#coverage -- coverage-report
      coverage-artifacts/component-cf-server-core-drv
      coverage-artifacts/component-cf-server-drv
      coverage-artifacts/component-cf-agent-drv
      coverage-artifacts/component-cf-builder-drv
      coverage-artifacts/component-cf-keygen-drv
      coverage-artifacts/state-machine-test
      coverage-artifacts/cve-test
      coverage-artifacts/dashboard-visibility-test
  artifacts:
    expire_in: 30 days
    paths:
      - coverage-report/report.txt
  rules:
    - if: '$CF_COVERAGE == "1" && ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main")'

complexity-check:
  stage: metrics
  tags:
    - nix
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix build .#code-metrics.complexity-report --no-link --option substitute true --option substituters https://cache.nixos.org --option extra-substituters '' --option accept-flake-config false --builders '' --max-jobs 1 --cores 2
    - nix develop .#sqlx --option substitute true --option substituters https://cache.nixos.org --option extra-substituters '' --option accept-flake-config false --builders '' --max-jobs 1 --cores 2 -c env CARGO_NET_OFFLINE=false cargo fetch --locked --manifest-path packages/default/Cargo.toml
    - nix develop .#sqlx --option substitute true --option substituters https://cache.nixos.org --option extra-substituters '' --option accept-flake-config false --builders '' --max-jobs 1 --cores 2 -c env CARGO_NET_OFFLINE=false cargo fetch --locked --manifest-path packages/web-ui/Cargo.toml
    - |
      export CARGO_NET_OFFLINE=true
      export SQLX_OFFLINE=true
      export NIX_CONFIG="${NIX_CONFIG:-}
      substituters =
      extra-substituters =
      substitute = false
      builders =
      builders-use-substitutes = false
      fallback = false
      accept-flake-config = false
      max-jobs = 1
      cores = 2
      "
      nix run --offline --option substituters '' --option substitute false \
        --builders '' --option fallback false --option accept-flake-config false \
        --max-jobs 1 --cores 2 .#code-metrics.complexity-report
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - complexity-report/
    expose_as: "Code Complexity Report"
    reports:
      junit: complexity-report/junit-report.xml
  only:
    - merge_requests
    - main

auto-bump-patch:
  stage: bump
  tags:
    - nix
  before_script:
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - nix run .#ci.bump-patch
    - nix run .#ci.cleanup-patch-tags -- 5 # Keep latest 5 patch tags
  only:
    - main
  when: on_success

manual-version-bump:
  stage: bump
  tags:
    - nix
  before_script:
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - nix run .#ci.bump-version -- $NEW_VERSION
  only:
    - main
  when: manual
  variables:
    NEW_VERSION: ""

# Implemented integration owners run automatically and are required. The normal
# owner aggregate builds every registered scenario gate and fails when any gate
# fails. Never build a `.run` output here: it records a failed scenario and can
# still build successfully. Access, Delivery and Assurance have real scenarios;
# Upgrade is added only with a real approved version transition. See
# docs/knowledge/testing/integration-coverage-map.md for the remaining gaps.
integration-access:
  stage: check
  tags:
    - nix
  retry:
    max: 2
    when:
      - runner_system_failure
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - sh packages/ci/integration-owner-build.sh integration-access
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - integration-evidence/
    expose_as: "Integration Access Evidence"
  only:
    - merge_requests
    - main

integration-delivery:
  extends: integration-access
  script:
    - sh packages/ci/integration-owner-build.sh integration-delivery
  artifacts:
    expose_as: "Integration Delivery Evidence"

integration-assurance:
  extends: integration-access
  script:
    - sh packages/ci/integration-owner-build.sh integration-assurance
  artifacts:
    expose_as: "Integration Assurance Evidence"

integration-upgrade:
  extends: integration-access
  script:
    - sh packages/ci/integration-owner-build.sh integration-upgrade
  artifacts:
    expose_as: "Integration Upgrade Evidence"

# Ordinary component builds own unit, evaluator-protocol and schema checks.
# Pure module assertions and developer-command selftests run directly here;
# there is no verification package per former suite.
component-tests:
  stage: check
  tags:
    - nix
  retry:
    max: 2
    when:
      - runner_system_failure
  before_script:
    # Create .netrc using CI job token (more secure)
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - |
      for component in cf-server-core-drv cf-server-drv cf-agent-drv cf-builder-drv cf-keygen-drv; do
        target=".#default.$component"
        if [ "${CF_COVERAGE:-0}" = 1 ]; then target="$target.coverage"; fi
        sh packages/ci/public-cache-build.sh "$target" -L --show-trace --builders '' --max-jobs 1 --cores 2
        if [ "${CF_COVERAGE:-0}" = 1 ]; then
          mkdir -p coverage-artifacts
          cp -rL --no-preserve=mode "$(nix eval --raw "$target.profile.outPath")" "coverage-artifacts/component-$component"
        fi
      done
    - nix build .#nixos-options-metadata .#oscal-fixture .#okf-knowledge .#xccdf-1-2-schemas -L --show-trace --builders '' --max-jobs 1 --cores 2
    - nix build .#code-metrics.complexity-report --no-link --option substituters https://cache.nixos.org --option extra-substituters '' --option accept-flake-config false --builders '' --max-jobs 1 --cores 2
    - |
      for suite in builder-cve stig packaging; do
        nix eval --impure --json --expr "
          let
            f = builtins.getFlake (\"git+file://\" + toString ./.);
            p = import f.inputs.nixpkgs {
              system = builtins.currentSystem;
              overlays = [ f.overlays.default ];
            };
          in import ./modules/nixos/crystal-forge/tests/$suite.nix {
            inputs = f.inputs // { self = f; };
            pkgs = p;
            lib = p.lib // { crystal-forge = f.lib; };
          }"
      done
    - |
      nix shell --impure --expr '
        let
          f = builtins.getFlake ("git+file://" + toString ./.);
          p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
        in [ p.bash p.coreutils p.gnugrep p.gnused p.iproute2 p.procps p.util-linux
             p.nodejs p.python3 p.nix-eval-jobs.nix p.nix-eval-jobs p.git
             p.remarshal p.jq p.libxml2 p.openscap ]
      ' --builders '' --max-jobs 1 --cores 2 --command bash -euo pipefail -c '
        bash modules/nixos/crystal-forge/tests/discovery.sh
        bash modules/nixos/crystal-forge/tests/packaging.sh
        core_target=.#default.cf-server-core-drv
        if [ "${CF_COVERAGE:-0}" = 1 ]; then core_target="$core_target.coverage"; fi
        core=$(nix eval --raw "$core_target.outPath")
        xccdf_schemas=$(nix eval --raw .#xccdf-1-2-schemas.outPath)
        if [ "${CF_COVERAGE:-0}" = 1 ]; then
          export LLVM_PROFILE_FILE="$PWD/coverage-artifacts/schema-raw/%m-%p.profraw"
          mkdir -p coverage-artifacts/schema-raw
        fi
        bash packages/default/crates/cf-server/tests/xccdf-schema.sh \
          "$core" "$xccdf_schemas" "$PWD/schemas/cf-xccdf-1/cf-xccdf-1.xsd"
        if [ "${CF_COVERAGE:-0}" = 1 ]; then
          llvm_bin="$(nix eval --raw .#coverage.llvm.outPath)/bin"
          profile=coverage-artifacts/component-cf-server-core-drv/profile.profdata
          "$llvm_bin/llvm-profdata" merge -sparse "$profile" coverage-artifacts/schema-raw/*.profraw -o "$profile.tmp"
          mv "$profile.tmp" "$profile"
          rm -r coverage-artifacts/schema-raw
          unset LLVM_PROFILE_FILE
        fi
        unset DB_HOST DB_PORT DB_USER DB_NAME
        bash packages/devScripts/db-usability-check-test.sh packages/devScripts/db-usability-check.sh
        bash packages/devScripts/db-only-start-test.sh packages/devScripts/db-only-start.sh
        bash packages/devScripts/web-ui/tests/web-ui-test-runner-test.sh \
          packages/devScripts/web-ui/tests/web-ui-test.sh packages/devScripts/web-ui/coverage-manifest.json
        complexity=$(nix eval --raw .#code-metrics.complexity-report.outPath)
        CARGO_NET_OFFLINE=true python3 packages/code-metrics/test-report.py "$complexity/bin/complexity-report"
      '
  artifacts:
    when: always
    paths:
      - coverage-artifacts/
  only:
    - merge_requests
    - main

# Preserve the CVE workspace library filters (including the three ignored
# scanning filters) and dashboard's two ignored visibility groups. All three
# apps share invocation-owned initialization, root privilege separation and
# fail-closed completion receipts; they do not share a running database.
cve-processing-test:
  extends: state-machine-tests
  variables:
    DATABASE_TEST_APP: cve-test
  artifacts: &database-ci-evidence
    when: always
    expire_in: 30 days
    paths:
      - database-ci-evidence/
      - coverage-artifacts/

# Runs the dashboard aggregate visibility regressions (queries::dashboard::tests::visibility_
# and handlers::api::dashboard::tests::visibility_, all #[ignore]-marked) via the
# repo-owned `devScripts.dashboard-visibility-test` isolated process-compose app.
dashboard-visibility-tests:
  extends: state-machine-tests
  variables:
    DATABASE_TEST_APP: dashboard-visibility-test
  artifacts: *database-ci-evidence

# One invocation-owned PostgreSQL cluster and Cargo target directory run the
# unique ignored library/integration regressions and populated migration
# rehearsals. Nonignored library tests stay in ordinary component builds.
state-machine-tests:
  stage: check
  tags:
    - nix
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    # Preparation may acquire missing closures and Cargo sources. Execution below
    # must fail on missing prerequisites instead of fetching them during tests.
    - |
      if [ "${CF_COVERAGE:-0}" = 1 ]; then
        nix build .#coverage --no-link --builders '' --max-jobs 1 --cores 2
      fi
    - nix build ".#devScripts.${DATABASE_TEST_APP:-state-machine-test}" --no-link --builders '' --option substituters https://cache.nixos.org --option extra-substituters '' --option accept-flake-config false --max-jobs 1 --cores 2
    - nix develop .#sqlx --builders '' --option substituters https://cache.nixos.org --option extra-substituters '' --option accept-flake-config false --max-jobs 1 --cores 2 -c cargo fetch --locked --manifest-path packages/default/Cargo.toml
    - |
      if [ -n "${DATABASE_TEST_APP:-}" ]; then
        nix shell --impure --expr '
          let
            f = builtins.getFlake ("git+file://" + toString ./.);
            p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
          in [ p.python3 p.bash ]
        ' --builders '' --option substituters https://cache.nixos.org \
          --option extra-substituters '' --option accept-flake-config false \
          --max-jobs 1 --cores 2 --command true
      fi
    - |
      if [ -n "${DATABASE_TEST_APP:-}" ]; then
        nix shell --offline --option substituters '' --option substitute false \
          --option builders '' --option fallback false \
          --option accept-flake-config false --max-jobs 0 --no-update-lock-file \
          --impure --expr '
            let
              f = builtins.getFlake ("git+file://" + toString ./.);
              p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
            in [ p.python3 p.bash ]
          ' --command python3 packages/devScripts/tests/database-ci-test.py \
            "database-ci-evidence/$DATABASE_TEST_APP" "$DATABASE_TEST_APP"
      fi
    - |
      export CARGO_NET_OFFLINE=true SQLX_OFFLINE=true
      if [ "${CF_COVERAGE:-0}" = 1 ]; then
        export CF_LLVM_BIN="$(nix eval --raw .#coverage.llvm.outPath)/bin"
        export CF_COVERAGE_DIR="$PWD/coverage-artifacts/${DATABASE_TEST_APP:-state-machine-test}"
      fi
      nix run --offline --option substituters '' --option substitute false \
        --option builders '' --option fallback false \
        --option accept-flake-config false --max-jobs 0 --no-update-lock-file \
        ".#devScripts.${DATABASE_TEST_APP:-state-machine-test}" -- -t=false up
  artifacts:
    when: always
    paths:
      - coverage-artifacts/
  only:
    - merge_requests
    - main

stages:
  - check
  - metrics
  - coverage
  - bump

variables:
  # GitLab API for posting MR comments
  GITLAB_API_URL: "${CI_API_V4_URL}"

# Post coverage report as MR comment
.coverage-mr-comment:
  stage: coverage
  tags:
    - nix
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      # Read the summary markdown
      SUMMARY=$(cat coverage-report/summary.md)

      # Escape for JSON
      SUMMARY_ESCAPED=$(echo "$SUMMARY" | jq -Rs '.')

      # Post or update MR comment
      if [ -n "${CI_MERGE_REQUEST_IID}" ]; then
        # Check for existing comment
        EXISTING_COMMENTS=$(curl -s --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes")

        COMMENT_ID=$(echo "$EXISTING_COMMENTS" | jq -r '.[] | select(.body | contains("Code Coverage Report")) | .id')

        if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then
          # Update existing comment
          curl -s -X PUT --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"body\": $SUMMARY_ESCAPED}" \
            "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/$COMMENT_ID"
          echo "Updated existing MR comment"
        else
          # Create new comment
          curl -s -X POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"body\": $SUMMARY_ESCAPED}" \
            "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
          echo "Posted new MR comment"
        fi
      fi
  dependencies:
    - coverage-check
  only:
    - merge_requests

coverage-check:
  stage: coverage
  tags:
    - nix
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix run .#coverage.coverage-report
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage-report/
    expose_as: "Code Coverage Report"
    reports:
      junit: coverage-report/junit-report.xml
  only:
    - merge_requests
    - main

# Post complexity report as MR comment
.complexity-mr-comment:
  stage: metrics
  tags:
    - nix
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      # Read the summary markdown
      SUMMARY=$(cat complexity-report/summary.md)

      # Escape for JSON
      SUMMARY_ESCAPED=$(echo "$SUMMARY" | jq -Rs '.')

      # Post or update MR comment
      if [ -n "${CI_MERGE_REQUEST_IID}" ]; then
        # Check for existing comment
        EXISTING_COMMENTS=$(curl -s --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes")
        
        COMMENT_ID=$(echo "$EXISTING_COMMENTS" | jq -r '.[] | select(.body | contains("Code Complexity Report")) | .id')
        
        if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then
          # Update existing comment
          curl -s -X PUT --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"body\": $SUMMARY_ESCAPED}" \
            "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/$COMMENT_ID"
          echo "Updated existing MR comment"
        else
          # Create new comment
          curl -s -X POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"body\": $SUMMARY_ESCAPED}" \
            "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
          echo "Posted new MR comment"
        fi
      fi
  dependencies:
    - complexity-check
  only:
    - merge_requests

complexity-check:
  stage: metrics
  tags:
    - nix
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix run .#code-metrics.complexity-report
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - complexity-report/
    expose_as: "Code Complexity Report"
    reports:
      junit: complexity-report/junit-report.xml
  only:
    - merge_requests
    - main

auto-bump-patch:
  stage: bump
  tags:
    - nix
  before_script:
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - nix run .#ci.bump-patch
    - nix run .#ci.cleanup-patch-tags -- 5 # Keep latest 5 patch tags
  only:
    - main
  when: on_success

manual-version-bump:
  stage: bump
  tags:
    - nix
  before_script:
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - nix run .#ci.bump-version -- $NEW_VERSION
  only:
    - main
  when: manual
  variables:
    NEW_VERSION: ""

flake-check:
  stage: check
  tags:
    - nix
  retry:
    max: 2
    when:
      - runner_system_failure
  parallel:
    matrix:
      - CHECK_NAME:
          - integration
          - oidc-auth
          - server-regressions
  before_script:
    # Create .netrc using CI job token (more secure)
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix build ".#checks.x86_64-linux.${CHECK_NAME}" -L --show-trace
  only:
    - merge_requests
    - main

# Generates reviewable strict-baseline candidates without weakening the normal
# Web UI gate. Start this job only after a strict visual failure is confirmed as
# intentional. The governance shard owns all strict workflows, and semantic
# failures still fail this job.
web-ui-baseline-candidates:
  stage: check
  tags:
    - nix
  allow_failure: true
  when: manual
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - CF_UI_UPDATE_BASELINES=1 nix build --impure ".#checks.x86_64-linux.web-ui-governance" -L --show-trace
    - mkdir -p web-ui-baseline-candidates
    - STORE_PATH=$(readlink -f result)
    - test -d "$STORE_PATH/screenshots"
    - cp -r "$STORE_PATH/screenshots/"* web-ui-baseline-candidates/
  artifacts:
    expire_in: 30 days
    paths:
      - web-ui-baseline-candidates/
    expose_as: "Web UI Baseline Candidates"
  only:
    - merge_requests

# These five required jobs form one logical Web UI merge gate. The matrix lets
# runners execute checks concurrently without changing behavior when they queue.
web-ui-check:
  stage: check
  tags:
    - nix
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
  parallel:
    matrix:
      - CHECK_NAME:
          - web-ui
          - web-ui-fleet
          - web-ui-pipeline
          - web-ui-governance
          - web-ui-exports
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - WEB_UI_BLOCKING=true nix run .#web-ui-producer
  artifacts:
    when: always
    expire_in: 30 days
    name: "web-ui-evidence-${CHECK_NAME}-${CI_JOB_ID}"
    paths:
      - web-ui-evidence/${CHECK_NAME}/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Design parity is useful reviewer evidence, but drift does not block merging.
web-ui-design-parity:
  stage: check
  tags:
    - nix
  interruptible: true
  allow_failure: true
  variables:
    CHECK_NAME: web-ui-design-parity
    WEB_UI_BLOCKING: "false"
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix run .#web-ui-producer
  artifacts:
    when: always
    expire_in: 30 days
    name: "web-ui-evidence-${CHECK_NAME}-${CI_JOB_ID}"
    paths:
      - web-ui-evidence/${CHECK_NAME}/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# This single advisory consumer owns uploads and comments. Producer failures
# still fail their blocking jobs; reporting failures do not fail the pipeline.
# Configure GITLAB_TOKEN as a masked project variable with API scope. Without
# it, the complete report and downloaded evidence remain job artifacts.
web-ui-evidence-report:
  stage: metrics
  tags:
    - nix
  interruptible: true
  when: always
  allow_failure: true
  script:
    - nix run .#web-ui-evidence-report
  needs:
    - job: web-ui-check
      artifacts: true
    - job: web-ui-design-parity
      artifacts: true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - web-ui-report/
      - web-ui-evidence/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Runs the CVE scan loop processing test (scan_cycle_processes_target_with_fake_runner)
# via the repo-owned `devScripts.cve-test` process-compose project. That target
# starts the DB service, waits for health, runs migrations + the targeted test,
# and then shuts itself down so `up --tui=false` exits cleanly.
cve-processing-test:
  stage: check
  tags:
    - nix
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix run .#devScripts.cve-test -- up --tui=false
  only:
    - merge_requests
    - main

# Runs the dashboard aggregate visibility regressions (queries::dashboard::tests::visibility_
# and handlers::api::dashboard::tests::visibility_, all #[ignore]-marked) via the
# repo-owned `devScripts.dashboard-visibility-test` process-compose project. That
# target starts an isolated DB, applies migrations, runs the authorization-sensitive
# scoping tests with --ignored, and exits.
dashboard-visibility-tests:
  stage: check
  tags:
    - nix
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix run .#devScripts.dashboard-visibility-test -- up --tui=false
  only:
    - merge_requests
    - main

# Runs the evaluation state-machine regression tests (queries::commits::tests and
# queries::derivations::tests, all #[ignore]-marked) via the repo-owned
# `devScripts.state-machine-test` process-compose project. That target starts an
# isolated DB, applies migrations, runs the tests with --ignored, and exits.
state-machine-tests:
  stage: check
  tags:
    - nix
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix run .#devScripts.state-machine-test -- up --tui=false
  only:
    - merge_requests
    - main

# A new commit cancels the superseded merge request pipeline. Deployment,
# Pages publication and version bumps are not interruptible.
workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

stages:
  - check
  - metrics
  - coverage
  - deploy
  - bump

# This static browser gate does not need the Dioxus application or a database.
docs-site-check:
  stage: check
  tags:
    - nix
  script:
    - nix build .#docs-site.tests.browser -L --out-link docs-site-check-result
    - nix build .#docs-site -L --out-link docs-site-result
    - mkdir -p public docs-site-screenshots
    - cp -rL docs-site-result/share/docs-site/. public/
    - cp -rL docs-site-check-result/screenshots/. docs-site-screenshots/
  artifacts:
    expire_in: 30 days
    paths:
      - public/
      - docs-site-screenshots/
    expose_as: "Documentation Site"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

docs-pages:
  stage: deploy
  tags:
    - nix
  interruptible: false
  needs:
    - docs-site-check
  script:
    - test -s public/index.html
  pages:
    publish: public
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

coverage-check:
  stage: coverage
  tags:
    - nix
  before_script:
    # Retain repository authentication for flake input resolution. Collection
    # itself never builds or runs product tests.
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  needs:
    - component-tests
    - database-tests
    - database-launcher-tests
  script:
    # This job reads artifacts only. All test failures belong to their producers.
    - >-
      nix run .#coverage -- coverage-report
      coverage-artifacts/component-cf-server-core-drv
      coverage-artifacts/component-cf-agent-drv
      coverage-artifacts/component-cf-builder-drv
      coverage-artifacts/component-cf-keygen-drv
      coverage-artifacts/state-machine-test
      coverage-artifacts/cve-test
      coverage-artifacts/dashboard-visibility-test
  artifacts:
    expire_in: 30 days
    paths:
      - coverage-report/report.txt
  rules:
    - if: '$CF_COVERAGE == "1" && ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main")'

complexity-check:
  stage: metrics
  tags:
    - nix
  # Depends on nothing; do not wait for the check stage.
  needs: []
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix build .#code-metrics.complexity-report --no-link
    - nix develop .#sqlx -c env CARGO_NET_OFFLINE=false cargo fetch --locked --manifest-path packages/default/Cargo.toml
    - nix develop .#sqlx -c env CARGO_NET_OFFLINE=false cargo fetch --locked --manifest-path packages/web-ui/Cargo.toml
    - |
      export CARGO_NET_OFFLINE=true
      export SQLX_OFFLINE=true
      export NIX_CONFIG="${NIX_CONFIG:-}
      substituters =
      extra-substituters =
      substitute = false
      builders =
      builders-use-substitutes = false
      fallback = false
      accept-flake-config = false
      max-jobs = 1
      cores = 2
      "
      nix run --offline --option substituters '' --option substitute false \
        --builders '' --option fallback false --option accept-flake-config false \
        --max-jobs 1 --cores 2 .#code-metrics.complexity-report
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - complexity-report/
    expose_as: "Code Complexity Report"
    reports:
      junit: complexity-report/junit-report.xml
  only:
    - merge_requests
    - main

auto-bump-patch:
  stage: bump
  tags:
    - nix
  interruptible: false
  before_script:
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - nix run .#ci.bump-patch
    - nix run .#ci.cleanup-patch-tags -- 5 # Keep latest 5 patch tags
  only:
    - main
  when: on_success

manual-version-bump:
  stage: bump
  tags:
    - nix
  interruptible: false
  before_script:
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - nix run .#ci.bump-version -- $NEW_VERSION
  only:
    - main
  when: manual
  variables:
    NEW_VERSION: ""

# Implemented integration owners run automatically and are required. Each
# registered scenario gate runs as its own job in a child pipeline generated
# from the owners' `scenarios` sets (packages/ci/integration-pipeline.nix), so
# scenarios run concurrently and a failed one can be retried alone.
# `strategy: depend` fails this pipeline when any scenario fails. The packages
# every scenario boots are built here first, so scenario jobs substitute them
# instead of each compiling them. Never build a `.run` output as a gate: it
# records a failed scenario and can still build successfully. Remaining gaps:
# docs/knowledge/testing/integration-coverage-map.md.
integration-pipeline:
  stage: check
  tags:
    - nix
  needs: []
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix build .#default.cf-server-drv .#default.cf-agent-drv .#default.cf-builder-drv --no-link -L
    - nix eval --json .#checks.x86_64-linux --apply "$(cat packages/ci/integration-pipeline.nix)" > integration-pipeline.yml
  artifacts:
    paths:
      - integration-pipeline.yml
  only:
    - merge_requests
    - main

integration-scenarios:
  stage: check
  needs:
    - integration-pipeline
  trigger:
    include:
      - artifact: integration-pipeline.yml
        job: integration-pipeline
    strategy: depend
  only:
    - merge_requests
    - main

# Ordinary component builds own unit, evaluator-protocol and schema checks.
# Pure module assertions and developer-command selftests run directly here;
# there is no verification package per former suite.
component-tests:
  stage: check
  tags:
    - nix
  retry:
    max: 2
    when:
      - runner_system_failure
  before_script:
    # Create .netrc using CI job token (more secure)
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - |
      # integration-pipeline builds cf-server-drv, cf-agent-drv and cf-builder-drv
      # (agent and builder tests run in their check phases). Coverage needs the
      # instrumented agent and builder variants here.
      components="cf-server-core-drv cf-keygen-drv"
      if [ "${CF_COVERAGE:-0}" = 1 ]; then
        components="cf-server-core-drv cf-agent-drv cf-builder-drv cf-keygen-drv"
      fi
      for component in $components; do
        target=".#default.$component"
        if [ "${CF_COVERAGE:-0}" = 1 ]; then target="$target.coverage"; fi
        nix build "$target" -L --show-trace
        if [ "${CF_COVERAGE:-0}" = 1 ]; then
          mkdir -p coverage-artifacts
          cp -rL --no-preserve=mode "$(nix eval --raw "$target.profile.outPath")" "coverage-artifacts/component-$component"
        fi
      done
    - nix build .#cf-nixos-module .#cf-nixos-module.tests.helper .#cf-nixos-module.tests.generation --no-link -L --show-trace
    - nix build .#nixos-options-metadata .#oscal-fixture .#okf-knowledge .#xccdf-1-2-schemas -L --show-trace
    - nix build .#code-metrics.complexity-report --no-link
    - |
      for suite in builder-cve stig packaging; do
        nix eval --impure --json --expr "
          let
            f = builtins.getFlake (\"git+file://\" + toString ./.);
            p = import f.inputs.nixpkgs {
              system = builtins.currentSystem;
              overlays = [ f.overlays.default ];
            };
          in import ./modules/nixos/crystal-forge/tests/$suite.nix {
            inputs = f.inputs // { self = f; };
            pkgs = p;
            lib = p.lib // { crystal-forge = f.lib; };
          }"
      done
    - |
      nix shell --impure --expr '
        let
          f = builtins.getFlake ("git+file://" + toString ./.);
          p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
        in [ p.bash p.coreutils p.gnugrep p.gnused p.iproute2 p.procps p.util-linux
             p.nodejs p.python3 p.nix-eval-jobs.nix p.nix-eval-jobs p.git
             p.remarshal p.jq p.libxml2 p.openscap ]
      ' --command bash -euo pipefail -c '
        bash modules/nixos/crystal-forge/tests/discovery.sh
        bash modules/nixos/crystal-forge/tests/packaging.sh
        core_target=.#default.cf-server-core-drv
        if [ "${CF_COVERAGE:-0}" = 1 ]; then core_target="$core_target.coverage"; fi
        core=$(nix eval --raw "$core_target.outPath")
        xccdf_schemas=$(nix eval --raw .#xccdf-1-2-schemas.outPath)
        if [ "${CF_COVERAGE:-0}" = 1 ]; then
          export LLVM_PROFILE_FILE="$PWD/coverage-artifacts/schema-raw/%m-%p.profraw"
          mkdir -p coverage-artifacts/schema-raw
        fi
        bash packages/default/crates/cf-server/tests/xccdf-schema.sh \
          "$core" "$xccdf_schemas" "$PWD/schemas/cf-xccdf-1/cf-xccdf-1.xsd"
        if [ "${CF_COVERAGE:-0}" = 1 ]; then
          llvm_bin="$(nix eval --raw .#coverage.llvm.outPath)/bin"
          profile=coverage-artifacts/component-cf-server-core-drv/profile.profdata
          "$llvm_bin/llvm-profdata" merge -sparse "$profile" coverage-artifacts/schema-raw/*.profraw -o "$profile.tmp"
          mv "$profile.tmp" "$profile"
          rm -r coverage-artifacts/schema-raw
          unset LLVM_PROFILE_FILE
        fi
        unset DB_HOST DB_PORT DB_USER DB_NAME
        bash packages/devScripts/db-usability-check-test.sh packages/devScripts/db-usability-check.sh
        bash packages/devScripts/db-only-start-test.sh packages/devScripts/db-only-start.sh
        bash packages/devScripts/web-ui/tests/web-ui-test-runner-test.sh \
          packages/devScripts/web-ui/tests/web-ui-test.sh packages/devScripts/web-ui/coverage-manifest.json
        complexity=$(nix eval --raw .#code-metrics.complexity-report.outPath)
        CARGO_NET_OFFLINE=true python3 packages/code-metrics/test-report.py "$complexity/bin/complexity-report"
      '
  artifacts:
    when: always
    paths:
      - coverage-artifacts/
  only:
    - merge_requests
    - main

# Preserve the CVE workspace library filters (including the three ignored
# scanning filters) and dashboard's two ignored visibility groups. All three
# apps share invocation-owned initialization, root privilege separation and
# fail-closed completion receipts; they do not share a running database.
# PostgreSQL-backed suites. Each launcher starts its own invocation-owned
# PostgreSQL cluster with root privilege separation and a fail-closed
# completion receipt; nothing shares a running database. The CVE and
# dashboard suites share one job, and so one Cargo compilation (the dashboard
# selections are a subset of the CVE configuration). The state-machine suite,
# the longest, runs in parallel in its own job.
database-tests:
  stage: check
  tags:
    - nix
  variables:
    DATABASE_TEST_APPS: state-machine-test
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    # Preparation may acquire missing closures and Cargo sources. Execution below
    # must fail on missing prerequisites instead of fetching them during tests.
    - |
      if [ "${CF_COVERAGE:-0}" = 1 ]; then
        nix build .#coverage --no-link
      fi
    - |
      for app in $DATABASE_TEST_APPS; do
        nix build ".#devScripts.$app" --no-link
      done
    - nix develop .#sqlx -c cargo fetch --locked --manifest-path packages/default/Cargo.toml
    # Failure-path checks of the CVE and dashboard launchers (initialization,
    # Cargo failure, empty and unrelated selections, receipts, interruption).
    - |
      if [ "$DATABASE_TEST_APPS" != state-machine-test ]; then
        nix shell --impure --expr '
          let
            f = builtins.getFlake ("git+file://" + toString ./.);
            p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
          in [ p.python3 p.bash ]
        ' --command true
        nix shell --offline --option substituters '' --option substitute false \
          --option builders '' --option fallback false \
          --option accept-flake-config false --max-jobs 0 --no-update-lock-file \
          --impure --expr '
            let
              f = builtins.getFlake ("git+file://" + toString ./.);
              p = import f.inputs.nixpkgs { system = builtins.currentSystem; };
            in [ p.python3 p.bash ]
          ' --command python3 packages/devScripts/tests/database-ci-test.py \
            database-ci-evidence $DATABASE_TEST_APPS
      fi
    - |
      export CARGO_NET_OFFLINE=true SQLX_OFFLINE=true
      for app in ${DATABASE_TEST_APP:-$DATABASE_TEST_APPS}; do
        if [ "${CF_COVERAGE:-0}" = 1 ]; then
          export CF_LLVM_BIN="$(nix eval --raw .#coverage.llvm.outPath)/bin"
          export CF_COVERAGE_DIR="$PWD/coverage-artifacts/$app"
        fi
        nix run --offline --option substituters '' --option substitute false \
          --option builders '' --option fallback false \
          --option accept-flake-config false --max-jobs 0 --no-update-lock-file \
          ".#devScripts.$app" -- -t=false up
      done
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - database-ci-evidence/
      - coverage-artifacts/
  only:
    - merge_requests
    - main

database-launcher-tests:
  extends: database-tests
  variables:
    DATABASE_TEST_APPS: cve-test dashboard-visibility-test

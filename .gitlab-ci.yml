# ============================================================================
# Version Bumping
# ============================================================================

auto-bump-patch:
  stage: bump
  tags:
    - nix
  before_script:
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - nix run .#ci.bump-patch
    - nix run .#ci.cleanup-patch-tags -- 5
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

manual-version-bump:
  stage: bump
  tags:
    - nix
  before_script:
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - nix run .#ci.bump-version -- "$NEW_VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    NEW_VERSION: ""

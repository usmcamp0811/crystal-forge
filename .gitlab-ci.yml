stages:
  - discover
  - check
  - metrics
  - coverage
  - bump

variables:
  GITLAB_API_URL: "${CI_API_V4_URL}"
  NIX_SYSTEM: "x86_64-linux"

# ============================================================================
# Dynamic Flake Checks
# Discovers all checks from nix flake and runs them as separate jobs
# ============================================================================

discover-checks:
  stage: discover
  tags:
    - nix
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - |
      set -euo pipefail

      # Write the child pipeline header (NO indentation in the heredoc content)
      cat > checks-pipeline.yml <<'EOF'
# Auto-generated by discover-checks job
# Do not edit manually - changes will be overwritten

stages:
  - check

.check-template:
  stage: check
  tags:
    - nix
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix build ".#checks.${NIX_SYSTEM}.${CHECK_NAME}" -L --show-trace
EOF

      # Discover checks (attr names) for the configured system
      nix eval --json ".#checks.${NIX_SYSTEM}" --apply builtins.attrNames \
        | nix run nixpkgs#jq -- -r '.[]' \
        | sort -u \
        | while IFS= read -r check_name; do
            # Sanitize check name for job name (GitLab job name constraints)
            job_name="$(printf '%s' "$check_name" | sed 's/[^a-zA-Z0-9_-]/-/g')"

            {
              echo ""
              echo "check-${job_name}:"
              echo "  extends: .check-template"
              echo "  variables:"
              # Quote it so YAML never mis-parses the value
              echo "    CHECK_NAME: \"${check_name}\""
            } >> checks-pipeline.yml
          done

      echo "Generated checks-pipeline.yml:"
      sed -n '1,200p' checks-pipeline.yml
  artifacts:
    paths:
      - checks-pipeline.yml
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

flake-checks:
  stage: check
  needs:
    - job: discover-checks
      artifacts: true
  trigger:
    include:
      - artifact: checks-pipeline.yml
        job: discover-checks
    strategy: depend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ============================================================================
# Coverage
# ============================================================================

.coverage-mr-comment:
  stage: coverage
  tags:
    - nix
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      SUMMARY=$(cat coverage-report/summary.md)
      SUMMARY_ESCAPED=$(echo "$SUMMARY" | jq -Rs '.')

      if [ -n "${CI_MERGE_REQUEST_IID}" ]; then
        EXISTING_COMMENTS=$(curl -s --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes")

        COMMENT_ID=$(echo "$EXISTING_COMMENTS" | jq -r '.[] | select(.body | contains("Code Coverage Report")) | .id')

        if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then
          curl -s -X PUT --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"body\": $SUMMARY_ESCAPED}" \
            "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/$COMMENT_ID"
          echo "Updated existing MR comment"
        else
          curl -s -X POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"body\": $SUMMARY_ESCAPED}" \
            "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
          echo "Posted new MR comment"
        fi
      fi
  dependencies:
    - coverage-check
  only:
    - merge_requests

coverage-check:
  stage: coverage
  tags:
    - nix
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix run .#coverage.coverage-report
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage-report/
    expose_as: "Code Coverage Report"
    reports:
      junit: coverage-report/junit-report.xml
  only:
    - merge_requests
    - main


stages:
  - discover
  - check
  - metrics
  - coverage
  - bump

variables:
  # GitLab API for posting MR comments
  GITLAB_API_URL: "${CI_API_V4_URL}"

# ============================================================================
# Dynamic Flake Checks
# Discovers all checks from nix flake and runs them as separate jobs
# ============================================================================

discover-checks:
  stage: discover
  tags:
    - nix
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - |
      # Generate child pipeline config with one job per flake check
      cat > checks-pipeline.yml << 'EOF'
      # Auto-generated by discover-checks job
      # Do not edit manually - changes will be overwritten

      stages:
        - check

      .check-template:
        stage: check
        tags:
          - nix
        before_script:
          - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
          - echo "login gitlab-ci-token" >> ~/.netrc
          - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
          - chmod 600 ~/.netrc
        script:
          - nix build .#checks.x86_64-linux.$CHECK_NAME -L --show-trace
      EOF

      # Get list of checks from flake and add a job for each
      nix flake show --json 2>/dev/null | jq -r '.checks["x86_64-linux"] | keys[]' | sort -u | while read check_name; do
        # Sanitize check name for job name (replace special chars with dash)
        job_name=$(echo "$check_name" | sed 's/[^a-zA-Z0-9_-]/-/g')

        echo "" >> checks-pipeline.yml
        echo "check-${job_name}:" >> checks-pipeline.yml
        echo "  extends: .check-template" >> checks-pipeline.yml
        echo "  variables:" >> checks-pipeline.yml
        echo "    CHECK_NAME: ${check_name}" >> checks-pipeline.yml
      done

      echo "Generated checks-pipeline.yml:"
      cat checks-pipeline.yml
  artifacts:
    paths:
      - checks-pipeline.yml
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Trigger the dynamic checks pipeline
flake-checks:
  stage: check
  needs:
    - discover-checks
  trigger:
    include:
      - artifact: checks-pipeline.yml
        job: discover-checks
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================================
# Coverage
# ============================================================================

# Post coverage report as MR comment
.coverage-mr-comment:
  stage: coverage
  tags:
    - nix
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      # Read the summary markdown
      SUMMARY=$(cat coverage-report/summary.md)

      # Escape for JSON
      SUMMARY_ESCAPED=$(echo "$SUMMARY" | jq -Rs '.')

      # Post or update MR comment
      if [ -n "${CI_MERGE_REQUEST_IID}" ]; then
        # Check for existing comment
        EXISTING_COMMENTS=$(curl -s --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes")

        COMMENT_ID=$(echo "$EXISTING_COMMENTS" | jq -r '.[] | select(.body | contains("Code Coverage Report")) | .id')

        if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then
          # Update existing comment
          curl -s -X PUT --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"body\": $SUMMARY_ESCAPED}" \
            "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/$COMMENT_ID"
          echo "Updated existing MR comment"
        else
          # Create new comment
          curl -s -X POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"body\": $SUMMARY_ESCAPED}" \
            "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
          echo "Posted new MR comment"
        fi
      fi
  dependencies:
    - coverage-check
  only:
    - merge_requests

coverage-check:
  stage: coverage
  tags:
    - nix
  before_script:
    - echo "machine ${CI_SERVER_HOST}" > ~/.netrc
    - echo "login gitlab-ci-token" >> ~/.netrc
    - echo "password ${CI_JOB_TOKEN}" >> ~/.netrc
    - chmod 600 ~/.netrc
  script:
    - nix run .#coverage.coverage-report
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage-report/
    expose_as: "Code Coverage Report"
    reports:
      junit: coverage-report/junit-report.xml
  only:
    - merge_requests
    - main

